<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viking Raiderz — Professional 45 Second Trailer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071d25; color: #fff5d2; font-family: Inter, Arial, sans-serif; }
    main { width: min(96vw, 1320px); padding: 18px; text-align: center; }
    canvas { width: 100%; aspect-ratio: 16 / 9; border: 4px solid #d9a83c; border-radius: 12px; background: #0c2a35; box-shadow: 0 24px 75px #01090d; }
    iframe { position: fixed; left: -12000px; top: 0; width: 1500px; height: 1200px; border: 0; }
    .controls { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 14px; }
    button, a { padding: 13px 22px; border: 0; border-radius: 999px; color: #102e38; background: #f4c34d; font: 900 16px Inter, Arial, sans-serif; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    a { display: none; background: #82d59d; }
    #status { min-width: 310px; text-align: left; color: #cde5df; }
  </style>
</head>
<body>
  <main>
    <canvas id="output" width="1280" height="720" aria-label="Viking Raiderz professional trailer"></canvas>
    <div class="controls">
      <button id="record" disabled>Preparing the raiders…</button>
      <a id="download" download="Viking-Raiderz-Professional-Trailer-45s.mp4">Download trailer</a>
      <span id="status">Loading the War Council.</span>
    </div>
  </main>
  <iframe id="game" src="/?gameplayTrailer=1" title="Automated Viking Raiderz match"></iframe>
  <script type="module">
    const canvas = document.querySelector('#output');
    const ctx = canvas.getContext('2d');
    const iframe = document.querySelector('#game');
    const recordButton = document.querySelector('#record');
    const download = document.querySelector('#download');
    const status = document.querySelector('#status');
    const W = 1280, H = 720, DURATION = 45;
    const mp4Mime = [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4;codecs=avc1,mp4a.40.2',
      'video/mp4',
    ].find(value => MediaRecorder.isTypeSupported(value));
    const portraits = new Image(); portraits.src = '/art/faction-commanders-v1.png';
    const fjord = new Image(); fjord.src = '/art/bright-fjord-war-council.png';
    let recording = false;
    let startedAt = performance.now();
    let ready = false;
    let lastSaga = { title: 'THE SAGA DECK', outcome: 'Forty cards. Several excellent plans. No guarantees.', seenAt: -99 };
    let lastCardSequence = '';

    const clamp = (n, a = 0, b = 1) => Math.max(a, Math.min(b, n));
    const smooth = n => n * n * (3 - 2 * n);
    const fadeWindow = (time, start, end, fade = .45) => Math.min(clamp((time - start) / fade), clamp((end - time) / fade));
    function rr(x, y, w, h, r, fill, stroke, lineWidth = 2) {
      ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }
    function text(value, x, y, size, color = '#fff7d8', align = 'center', family = 'Georgia', weight = 900, shadow = true) {
      ctx.save(); ctx.font = `${weight} ${size}px ${family}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
      if (shadow) { ctx.shadowColor = 'rgba(3,18,24,.86)'; ctx.shadowBlur = Math.max(4, size / 8); ctx.shadowOffsetY = 3; }
      ctx.fillStyle = color; ctx.fillText(value, x, y); ctx.restore();
    }
    function cover(image, x, y, w, h, zoom = 1) {
      if (!image.complete || !image.naturalWidth) return;
      const sourceRatio = image.naturalWidth / image.naturalHeight;
      const targetRatio = w / h;
      let sw = image.naturalWidth / zoom, sh = image.naturalHeight / zoom;
      if (sourceRatio > targetRatio) sw = sh * targetRatio; else sh = sw / targetRatio;
      ctx.drawImage(image, (image.naturalWidth - sw) / 2, (image.naturalHeight - sh) / 2, sw, sh, x, y, w, h);
    }
    function configureGame() {
      const doc = iframe.contentDocument;
      const controllers = [...doc.querySelectorAll('#player-slots select')];
      ['normal', 'hard', 'expert', 'normal'].forEach((choice, index) => {
        controllers[index].value = choice;
        controllers[index].dispatchEvent(new Event('change', { bubbles: true }));
      });
      const pace = doc.querySelector('#ai-pace'); pace.value = 'rapid'; pace.dispatchEvent(new Event('change', { bubbles: true }));
      const cards = doc.querySelector('#event-card-frequency'); cards.value = 'every-turn'; cards.dispatchEvent(new Event('change', { bubbles: true }));
      doc.querySelector('#random-starting-player').checked = true;
      doc.querySelector('#random-player-order').checked = true;
      doc.querySelector('#winter-enabled').checked = true;
      doc.querySelector('#sound-effects-enabled').checked = false;
      doc.querySelector('#music-enabled').checked = false;
      doc.querySelector('#start-game').click();
      ready = Boolean(mp4Mime);
      recordButton.disabled = !ready;
      recordButton.textContent = ready ? 'Record professional trailer' : 'MP4 recording unavailable';
      status.textContent = ready ? 'Four computer chiefs are ready. Music and gameplay will be recorded.' : 'This browser cannot record a shareable H.264 MP4.';
    }
    iframe.addEventListener('load', () => setTimeout(configureGame, 900));

    function gameCanvas() { return iframe.contentDocument?.querySelector('#game-canvas canvas'); }
    function observeSaga() {
      const doc = iframe.contentDocument;
      if (!doc) return;
      const reveal = doc.querySelector('#event-reveal');
      if (reveal && !reveal.hidden) {
        const title = doc.querySelector('#event-title')?.textContent?.trim() || 'SAGA CARD';
        const outcome = doc.querySelector('#event-outcome')?.textContent?.trim() || 'The Norns remain unhelpfully mysterious.';
        const sequence = `${title}|${outcome}`;
        if (sequence !== lastCardSequence) {
          lastCardSequence = sequence;
          lastSaga = { title: title.toUpperCase(), outcome, seenAt: (performance.now() - startedAt) / 1000 };
        }
        doc.querySelector('#event-continue')?.click();
      }
    }
    setInterval(observeSaga, 160);

    function drawGameplay(time) {
      ctx.fillStyle = '#0b2934'; ctx.fillRect(0, 0, W, H);
      const source = gameCanvas();
      if (source) {
        const sourceRatio = source.width / source.height;
        const targetRatio = W / H;
        let sx = 0, sy = 0, sw = source.width, sh = source.height;
        if (sourceRatio > targetRatio) { sw = source.height * targetRatio; sx = (source.width - sw) / 2; }
        else { sh = source.width / targetRatio; sy = (source.height - sh) / 2; }
        ctx.drawImage(source, sx, sy, sw, sh, 0, 0, W, H);
      }
      const vignette = ctx.createRadialGradient(W / 2, H / 2, 240, W / 2, H / 2, 760);
      vignette.addColorStop(0, 'rgba(5,20,25,0)'); vignette.addColorStop(1, 'rgba(2,15,20,.56)');
      ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
      const doc = iframe.contentDocument;
      const round = doc?.querySelector('#round-label')?.textContent?.trim() || 'Round 1';
      rr(28, 24, 142, 42, 21, 'rgba(7,29,37,.84)', '#f4c34d', 2);
      text(round.toUpperCase(), 99, 46, 16, '#fff2b8', 'center', 'Arial', 800, false);
      text('VIKING RAIDERZ', 1248, 43, 19, '#fff5d2', 'right', 'Georgia', 900, true);
    }

    function lowerThird(time, start, end, heading, copy) {
      const a = fadeWindow(time, start, end, .5); if (a <= 0) return;
      ctx.save(); ctx.globalAlpha = smooth(a);
      const grad = ctx.createLinearGradient(0, 0, 920, 0); grad.addColorStop(0, 'rgba(7,28,36,.95)'); grad.addColorStop(1, 'rgba(7,28,36,.54)');
      rr(34, 555, 940, 124, 14, grad, '#d9a83c', 3);
      ctx.fillStyle = '#ef743b'; ctx.fillRect(51, 575, 7, 82);
      text(heading, 78, 590, 31, '#ffd35c', 'left');
      text(copy, 78, 633, 19, '#fff8df', 'left', 'Arial', 700, false);
      ctx.restore();
    }

    function drawSagaFeature(time) {
      const a = fadeWindow(time, 25.5, 31.5, .55); if (a <= 0) return;
      ctx.save(); ctx.globalAlpha = smooth(a);
      rr(932, 118, 314, 382, 18, 'rgba(255,248,224,.96)', '#f4c34d', 5);
      text('SAGA CARD', 1089, 151, 15, '#7e5932', 'center', 'Arial', 900, false);
      text(lastSaga.title.slice(0, 24), 1089, 197, 23, '#173b49');
      ctx.fillStyle = '#b74a7c'; ctx.beginPath(); ctx.arc(1089, 260, 43, 0, Math.PI * 2); ctx.fill();
      text('✦', 1089, 260, 48, '#fff6d7', 'center', 'Arial');
      ctx.font = '700 16px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#4d4032';
      const words = lastSaga.outcome.split(/\s+/); let line = '', lines = [];
      for (const word of words) { const trial = `${line} ${word}`.trim(); if (ctx.measureText(trial).width > 255) { lines.push(line); line = word; } else line = trial; }
      if (line) lines.push(line); lines.slice(0, 5).forEach((value, index) => ctx.fillText(value, 1089, 328 + index * 23));
      text('FATE HAS ENTERED THE CHAT.', 1089, 467, 13, '#a34669', 'center', 'Arial', 900, false);
      ctx.restore();
    }

    function drawIntro(time) {
      if (time >= 5.3) return;
      const a = time < 4.5 ? 1 : 1 - smooth(clamp((time - 4.5) / .8));
      ctx.save(); ctx.globalAlpha = a; cover(portraits, 0, 0, W, H, 1.04);
      const shade = ctx.createLinearGradient(0, 0, W, H); shade.addColorStop(0, 'rgba(4,24,31,.26)'); shade.addColorStop(.45, 'rgba(4,24,31,.66)'); shade.addColorStop(1, 'rgba(4,24,31,.35)');
      ctx.fillStyle = shade; ctx.fillRect(0, 0, W, H);
      rr(214, 160, 852, 372, 22, 'rgba(7,29,37,.83)', '#d9a83c', 4);
      text('VIKING RAIDERZ', W / 2, 252, 76, '#fff4c9');
      text('THE SAGA CONTINUES', W / 2, 327, 28, '#ef743b', 'center', 'Arial', 900);
      text('ONE FJORD  •  FOUR CHIEFS  •  MANY QUESTIONABLE DECISIONS', W / 2, 404, 20, '#ffd35c', 'center', 'Arial', 900, false);
      text('ASTRID  •  RAGNAR  •  FREYA  •  LEIF', W / 2, 463, 18, '#d9f4ee', 'center', 'Arial', 800, false);
      ctx.restore();
    }

    function drawOutro(time) {
      if (time < 39.5) return;
      const a = smooth(clamp((time - 39.5) / .7));
      ctx.save(); ctx.globalAlpha = a; cover(fjord, 0, 0, W, H, 1.08);
      ctx.fillStyle = 'rgba(5,25,32,.82)'; ctx.fillRect(0, 0, W, H);
      text('SOUND THE HORN', W / 2, 164, 31, '#ffd35c', 'center', 'Arial', 900);
      text('VIKING RAIDERZ', W / 2, 268, 80, '#fff4c9');
      text('THE SAGA CONTINUES', W / 2, 340, 28, '#ef743b', 'center', 'Arial', 900);
      text('1–4 PLAYERS  •  HOT-SEAT  •  FIVE COMPUTER LEVELS', W / 2, 425, 21, '#d9f4ee', 'center', 'Arial', 800, false);
      rr(342, 495, 596, 70, 35, '#f4c34d', '#fff3c4', 3);
      text('RAISE A CREW. BORROW A CASTLE.', W / 2, 531, 21, '#173642', 'center', 'Arial', 900, false);
      text('COMING SOON', W / 2, 628, 17, '#fff4c9', 'center', 'Arial', 900, false);
      ctx.restore();
    }

    function render(now) {
      const time = recording ? Math.min(DURATION, (now - startedAt) / 1000) : ((now - startedAt) / 1000) % DURATION;
      drawGameplay(time);
      lowerThird(time, 5, 10, 'CHOOSE YOUR CHIEF', '1–4 players. Human or computer. Grudges optional.');
      lowerThird(time, 10.2, 15.4, 'MANOEUVRE. THEN SPEND.', 'Move and fight first. Spend your loot when the shouting stops.');
      lowerThird(time, 15.6, 20.6, 'CREW THE LONGBOATS', 'Carry three Vikings across the fjord. Seatbelts remain unavailable.');
      lowerThird(time, 20.8, 25.3, 'UNLEASH THE CATAPULTS', 'Arc over obstacles. Scatter unpredictably. Apologise selectively.');
      lowerThird(time, 25.5, 31.5, 'DRAW FROM THE SAGA DECK', 'Forty cards bring treasure, trouble, mead and tactical goats.');
      drawSagaFeature(time);
      lowerThird(time, 31.7, 35.8, 'WINTER IS COMING', 'The fjord freezes. Longboats stop. Vikings keep walking.');
      lowerThird(time, 36, 39.4, 'CAPTURE THE CASTLES', 'Win glory, the kingdom, and an extremely awkward family reunion.');
      drawIntro(time); drawOutro(time);
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    async function audioBuffer(ac, path) {
      const response = await fetch(path); return ac.decodeAudioData(await response.arrayBuffer());
    }
    recordButton.addEventListener('click', async () => {
      if (!ready) return;
      recordButton.disabled = true; download.style.display = 'none'; status.textContent = 'Loading the Viking orchestra…';
      const ac = new AudioContext(); await ac.resume();
      const [musicBuffer, hornBuffer] = await Promise.all([
        audioBuffer(ac, '/audio/battle-report-viking-theme.mp3'),
        audioBuffer(ac, '/audio/opening-battle-horn.mp3'),
      ]);
      const audio = ac.createMediaStreamDestination();
      const compressor = ac.createDynamicsCompressor(); compressor.threshold.value = -15; compressor.ratio.value = 3; compressor.connect(audio);
      const music = ac.createBufferSource(); music.buffer = musicBuffer; music.loop = true;
      const musicGain = ac.createGain(); const start = ac.currentTime + .08;
      musicGain.gain.setValueAtTime(.001, start); musicGain.gain.linearRampToValueAtTime(.34, start + 1.5); musicGain.gain.setValueAtTime(.34, start + 40.5); musicGain.gain.linearRampToValueAtTime(.001, start + 44.8);
      music.connect(musicGain).connect(compressor); music.start(start, Math.min(7, Math.max(0, musicBuffer.duration - 1)));
      const horn = ac.createBufferSource(); horn.buffer = hornBuffer; const hornGain = ac.createGain();
      hornGain.gain.setValueAtTime(.48, start); hornGain.gain.linearRampToValueAtTime(.001, start + 4);
      horn.connect(hornGain).connect(compressor); horn.start(start);
      recording = true; startedAt = performance.now(); lastSaga.seenAt = -99;
      const video = canvas.captureStream(30);
      const stream = new MediaStream([...video.getVideoTracks(), ...audio.stream.getAudioTracks()]);
      const recorder = new MediaRecorder(stream, { mimeType: mp4Mime, videoBitsPerSecond: 9_000_000, audioBitsPerSecond: 192_000 });
      const chunks = [];
      recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mp4Mime });
        download.href = URL.createObjectURL(blob); download.style.display = 'inline-block';
        status.textContent = `Ready — ${(blob.size / 1024 / 1024).toFixed(1)} MB, 45-second H.264/AAC MP4.`;
        recordButton.disabled = false; recordButton.textContent = 'Record another trailer'; recording = false; ac.close();
      };
      recorder.start(1000);
      const ticker = setInterval(() => status.textContent = `Recording real gameplay… ${Math.floor(Math.min(DURATION, (performance.now() - startedAt) / 1000))} / ${DURATION} seconds`, 500);
      setTimeout(() => { clearInterval(ticker); recorder.stop(); music.stop(); }, DURATION * 1000 + 150);
    });
  </script>
</body>
</html>
